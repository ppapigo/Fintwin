location ^~ /api/ {
    include /etc/nginx/snippets/proxy-settings.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $backend_upstream;
}

location ^~ /oauth2/ {
    include /etc/nginx/snippets/proxy-settings.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $backend_upstream;
}

location ^~ /login/ {
    include /etc/nginx/snippets/proxy-settings.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $backend_upstream;
}

location = /logout {
    include /etc/nginx/snippets/proxy-settings.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $backend_upstream;
}

location ^~ /actuator/ {
    include /etc/nginx/snippets/proxy-settings.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $backend_upstream;
}

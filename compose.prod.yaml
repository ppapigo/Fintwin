name: fintwin-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/schema_init_mysql8.sql:/docker-entrypoint-initdb.d/001-schema-init.sql:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      FINTWIN_OAUTH_ENABLED: ${FINTWIN_OAUTH_ENABLED:?FINTWIN_OAUTH_ENABLED is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      FINTWIN_AI_ENABLED: ${FINTWIN_AI_ENABLED:?FINTWIN_AI_ENABLED is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-3s}
      OPENAI_READ_TIMEOUT: ${OPENAI_READ_TIMEOUT:-15s}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_MAX_RESPONSE_BYTES: ${OPENAI_MAX_RESPONSE_BYTES:-65536}
      FINTWIN_MARKET_DATA_ENABLED: ${FINTWIN_MARKET_DATA_ENABLED:-false}
      KRX_OPEN_API_KEY: ${KRX_OPEN_API_KEY:-}
      BOK_ECOS_API_KEY: ${BOK_ECOS_API_KEY:-}
      MARKET_DATA_CONNECT_TIMEOUT: ${MARKET_DATA_CONNECT_TIMEOUT:-3s}
      MARKET_DATA_READ_TIMEOUT: ${MARKET_DATA_READ_TIMEOUT:-5s}
      MARKET_DATA_CACHE_TTL: ${MARKET_DATA_CACHE_TTL:-30m}
      MARKET_DATA_MAX_RESPONSE_BYTES: ${MARKET_DATA_MAX_RESPONSE_BYTES:-65536}
      MARKET_DATA_STALE_DAYS: ${MARKET_DATA_STALE_DAYS:-7}
      BOK_BASE_RATE_STALE_DAYS: ${BOK_BASE_RATE_STALE_DAYS:-45}
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    networks:
      - edge
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      NGINX_TLS_MODE: ${NGINX_TLS_MODE:?NGINX_TLS_MODE is required}
      NGINX_ENVSUBST_FILTER: DOMAIN
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${LETSENCRYPT_DIR:?LETSENCRYPT_DIR is required}:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  mysql_data:
  certbot_webroot:

networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true

spring:
  application:
    name: fintwin
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
      file-size-threshold: 2MB
  jpa:
    open-in-view: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        path: /
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fintwin:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  oauth:
    enabled: ${FINTWIN_OAUTH_ENABLED:false}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
  ai:
    enabled: ${FINTWIN_AI_ENABLED:false}
    provider: openai
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:15s}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1200}
    max-response-bytes: ${OPENAI_MAX_RESPONSE_BYTES:65536}
  market-data:
    enabled: ${FINTWIN_MARKET_DATA_ENABLED:false}
    krx-api-key: ${KRX_OPEN_API_KEY:}
    bok-ecos-api-key: ${BOK_ECOS_API_KEY:}
    krx-base-url: https://data-dbg.krx.co.kr
    bok-ecos-base-url: https://ecos.bok.or.kr
    connect-timeout: ${MARKET_DATA_CONNECT_TIMEOUT:3s}
    read-timeout: ${MARKET_DATA_READ_TIMEOUT:5s}
    cache-ttl: ${MARKET_DATA_CACHE_TTL:30m}
    max-response-bytes: ${MARKET_DATA_MAX_RESPONSE_BYTES:65536}
    market-observation-stale-days: ${MARKET_DATA_STALE_DAYS:7}
    base-rate-observation-stale-days: ${BOK_BASE_RATE_STALE_DAYS:45}
